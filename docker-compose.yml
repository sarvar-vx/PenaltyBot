services:
  db:
    image: postgres:16-alpine
    container_name: penaltybot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - penaltybot_pgdata:/var/lib/postgresql/data
    networks:
      - penaltybot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: penaltybot_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - penaltybot_net

networks:
  penaltybot_net:
    driver: bridge

volumes:
  penaltybot_pgdata: